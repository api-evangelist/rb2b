method: probed
source: >-
  Live probe of the /.well-known/ discovery surface on every RB2B host named in
  apis.yml plus the two live API hosts confirmed in this pass
  (api.rb2b.com, app.rb2b.com). Status is the HTTP code observed at fetch time.
description: >-
  RB2B publishes no /.well-known/ document of its own. The single 200 in this
  probe is Intercom's platform-level security.txt, served by the hosted help
  centre at support.rb2b.com (a CNAME onto Intercom) and canonicalised to
  https://app.intercom.com/.well-known/security.txt — its Contact, Policy and
  Hiring lines all name Intercom, not RB2B. It is saved verbatim for the record
  but NO WellKnown or SecurityTxt pointer is emitted in apis.yml, because those
  pointers assert that the PROVIDER serves the surface, and RB2B does not.
  www.rb2b.com (Webflow) answers every /.well-known/ path with a 404 HTML stub
  reading "Invalid .well-known request"; api.rb2b.com, app.rb2b.com and
  ui.api.rb2b.com answer with the Rails 404 page.
