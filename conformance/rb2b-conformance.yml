  frameworks: [CCPA, GDPR]
  trust_center: https://retention.securitypal.com
  security_page: https://www.rb2b.com/security
  compliance_page: https://www.rb2b.com/compliance
  gdpr_page: https://www.rb2b.com/gdpr
  vulnerability_management: 'Amazon Inspector, 24/7 monitoring (stated on the security page)'
