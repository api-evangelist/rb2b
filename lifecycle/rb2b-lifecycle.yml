description: >-
  RB2B runs a product changelog on its help centre and keeps a manually-updated
  "Service Interruptions" article, but publishes no API versioning policy, no
  deprecation policy, no Sunset/Deprecation header support, no SLA, and no
  status page. Both REST surfaces sit at /api/v1 with no version negotiation of
  any kind.
versioning:
  scheme: path
  mechanism: URI path segment — /api/v1
  current: v1
  header: null
  negotiation: none
  policy_url: null
  notes: >-
    Both https://api.rb2b.com/api/v1 and https://app.rb2b.com/api/v1 are pinned
    to v1. RB2B does not publish what constitutes a breaking change, how a v2
    would be introduced, or how long v1 would be supported.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  changelog: https://support.rb2b.com/en/articles/10442291-changelog
  notes: >-
    No deprecation policy is published for either API. The changelog does record
    product removals after the fact (e.g. the 2026-03-31 removal of the
    dashboard Traffic Summary cards, and the 2026-01-28 Free-plan Slack
    notification pause), so change is communicated — but only as news, never as
    advance notice with a dated sunset.
  deprecated_operations: []
  deprecated_operations_note: >-
    None can be derived — there is no OpenAPI, so there are no deprecated:true
    flags to read.
