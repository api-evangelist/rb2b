integration_lifecycle:
  webhook_auto_disable: >-
    RB2B disconnects a destination webhook that returns any non-200, or that
    does not respond within 15 seconds. Repeated failures disable the
    integration and notify the account owner by email; it must then be
    re-enabled by hand.
  docs: https://support.rb2b.com/en/articles/9806566-webhook-faqs
  detail: asyncapi/rb2b-webhooks.yml
docs_lifecycle_finding:
  observation: >-
    The API Partner Program documentation was public and is now gated. The
    article at
    https://support.rb2b.com/en/articles/12579420-rb2b-s-api-partner-program —
    still cited by search engines and still referenced from apis.yml — returned
    HTTP 404 on 2026-08-12, and its parent collection
    https://support.rb2b.com/en/collections/16023167-api-partner-program returned
    HTTP 401. The RB2B site's own /apis page now 301-redirects to
    https://retention.com/apis, and https://postman.api.rb2b.com/ returns a
    Postman "Not found" page.
  effect: >-
    The only remaining public, machine-readable description of the Identity /
    Enrichment API is the npm tarball of RB2B's own MCP server.
