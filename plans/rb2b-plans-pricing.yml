description: >-
  RB2B prices two different things two different ways. The visitor-identification
  PLATFORM is a four-tier monthly subscription metered in "resolutions" with a
  published per-resolution overage rate. The API PARTNER PROGRAM — the
  Identity/Enrichment API at api.rb2b.com — is not tiered at all: it is a
  standalone account with a prepaid credit balance, entered through a $9 / 100
  credit starter pack, where each endpoint costs 1-4 credits per successful
  call. No volume pricing, credit-pack ladder, or enterprise tier is published
  for the API; the OEM Partner Program is sales-gated with no published price.
