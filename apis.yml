      - 'GET https://app.rb2b.com/api/v1/credit_usage → 401 {"error":"missing_api_key"}'
    contract_source: >-
      Endpoints, request bodies and response shapes documented verbatim by RB2B
      in the OEM API & Webhook Guide.
- aid: rb2b:rb2b-pixel-webhooks
  name: RB2B Pixel and Destination Webhooks
  tags:
    - Pixel
    - JavaScript
    - Webhooks
    - Integrations
    - Tag Manager
  humanURL: https://support.rb2b.com/en/collections/7815667-script-installation
  baseURL: https://ddwl4m2hdecbv.cloudfront.net
  description: >-
    The RB2B JavaScript pixel installed in a site header (or via Google
    Tag Manager / Segment / RudderStack / Shopify / Webflow / WordPress /
    HubSpot CMS / Wix / Next.js / React / Angular) is the primary data
    ingestion surface for RB2B. The snippet defines a global `reb2b` object
    and loads a per-account bundle from
    https://ddwl4m2hdecbv.cloudfront.net/b/{account_id}/{account_id}.js.gz.
    Resolved visitors are pushed downstream through an outbound webhook and
    destination layer that fans out to 50+ ad, CRM, marketing-automation,
    enrichment and orchestration tools — Slack, Microsoft Teams, Salesforce,
    HubSpot, Clay, Zapier, n8n, Make.com, Apollo, Instantly, Smartlead,
    Warmly, Pocus, Webhook URLs and others — based on the customer's tier and
    configuration. The webhook payload is a fixed, unsigned, non-customizable
    JSON object; a non-200 or a response slower than 15 seconds disconnects
    the integration.
  properties:
    - url: https://support.rb2b.com/en/collections/7815667-script-installation
      type: GettingStarted
    - url: https://support.rb2b.com/en/articles/8976614-setup-guide-webhook
      type: Documentation
    - url: asyncapi/rb2b-webhooks.yml
      type: Webhooks
    - url: components/rb2b-components.yml
      type: Components
    - url: https://support.rb2b.com/en/articles/9061641-setup-guide-apollo-io
      type: IntegrationGuide
    - url: https://support.rb2b.com/en/articles/9483538-rb2b-integration-creator-program
      type: PartnerProgram
