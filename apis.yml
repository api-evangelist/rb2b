aid: rb2b
name: RB2B
description: >-
  RB2B is a US-focused B2B website visitor identification platform that
  resolves anonymous web traffic into person-level leads — names, LinkedIn
  profiles, hashed and plaintext business emails, mobile ad IDs, and full
  business profiles — and pushes them to sales, marketing, and ad-tech
  systems. The product is delivered as a JavaScript pixel plus a knowledge-
  base and pipeline of 50+ destination integrations (Slack, Microsoft Teams,
  Salesforce, HubSpot, Clay, Zapier, Apollo, Customer.io, Demandbase, and
  others), with global company-level identification and US-only person-
  level resolution. RB2B operates a separate API Partner Program at
  api.rb2b.com/api/v1 that exposes credit-metered Identification endpoints
  (IP → Company, IP → HEM, IP → MAID) and Enrichment endpoints
  (HEM/Email → LinkedIn, HEM/Email → Business Profile, HEM/Email → MAID,
  LinkedIn → Hashed Emails, LinkedIn → Personal Email, LinkedIn → Mobile
  Phone, LinkedIn → Business Profile) for SaaS developers, GTM engineers,
  retailers, and ad-tech platforms that want to embed identity resolution
  into their own apps and identity graphs. A separate OEM Partner API at
  app.rb2b.com/api/v1 manages authorized domains and credit usage for
  partners embedding RB2B in their own products. RB2B publishes no OpenAPI;
  the only machine-readable description of its API is its own first-party
  MCP server, @rb2b/rb2b-apis-mcp, which exposes 19 tools over the same
  endpoints. The platform is SOC 2 Type 2 certified and CCPA compliant.
