- aid: rb2b:rb2b-identification-api
  name: RB2B Identification API
  tags:
    - Identity Resolution
    - Identification
    - IP Lookup
    - Hashed Email
    - Mobile Ad ID
    - B2B Data
  humanURL: https://ui.api.rb2b.com
  baseURL: https://api.rb2b.com/api/v1
  description: >-
    Credit-metered Identification endpoints that convert anonymous web
    signals (IP addresses) into business identifiers — POST /ip_to_company,
    POST /ip_to_hem (hashed email, ranked by confidence) and POST /ip_to_maid
    (mobile ad ID). Hosted on api.rb2b.com and accessed through the RB2B API
    Partner Program with its own standalone account, credit balance and
    Api-Key header. Person-level resolution is US-only; company-level
    resolution is global.
  properties:
