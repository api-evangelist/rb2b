      type: Portal
    - url: https://support.rb2b.com/en/
      type: Documentation
    - url: https://ui.api.rb2b.com/signup
      type: SignUp
    - url: https://www.npmjs.com/package/@rb2b/rb2b-apis-mcp
      type: MCPServer
  x-evidence:
    verified: '2026-08-12'
    method: live probe
    checks:
      - 'GET https://api.rb2b.com/api/v1/credits → 401 {"error":"missing_api_key"}'
      - 'POST https://api.rb2b.com/api/v1/ip_to_company → 401 {"error":"missing_api_key"}'
    contract_source: >-
      Endpoint paths and request bodies read from the provider's own published
      MCP server, @rb2b/rb2b-apis-mcp 1.1.7 (dist/api.js). No OpenAPI is
      published — /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
      /api-docs, /docs and /redoc all 404 on api.rb2b.com.
- aid: rb2b:rb2b-enrichment-api
  name: RB2B Enrichment API
  tags:
    - Enrichment
    - LinkedIn
    - Email
    - Phone
    - Business Profile
    - B2B Data
  humanURL: https://ui.api.rb2b.com
  baseURL: https://api.rb2b.com/api/v1
  description: >-
    Credit-metered Enrichment endpoints that take a known identifier — hashed
    email (MD5), plaintext email, or LinkedIn slug — and return additional B2B
    attributes: POST /hem_to_linkedin, /hem_to_best_linkedin,
    /hem_to_business_profile and /hem_to_maid (each accepting either an `md5`
    or an `email` key), plus /linkedin_to_hashed_emails,
    /linkedin_to_best_personal_email, /linkedin_to_personal_email,
    /linkedin_to_mobile_phone and /linkedin_to_business_profile. Costs run 1–4
    credits per successful call. Designed for SaaS developers, GTM engineers
    and ad-tech platforms enriching their own identity graphs. Shares the
    api.rb2b.com host, account and credit balance with the Identification API.
  properties:
    - url: https://ui.api.rb2b.com
      type: Portal
    - url: https://support.rb2b.com/en/
      type: Documentation
    - url: https://ui.api.rb2b.com/signup
      type: SignUp
    - url: https://www.npmjs.com/package/@rb2b/rb2b-apis-mcp
      type: MCPServer
  x-evidence:
    verified: '2026-08-12'
    method: live probe
    checks:
      - 'POST https://api.rb2b.com/api/v1/ip_to_company with a malformed key → 401 {"error":"invalid_api_key_format"}'
    contract_source: >-
      Endpoint paths, request-body keys and per-call credit costs read verbatim
      from @rb2b/rb2b-apis-mcp 1.1.7; captured in mcp/rb2b-mcp-tools.json and
      mcp/rb2b-tool-crosswalk.yml.
- aid: rb2b:rb2b-oem-partner-api
  name: RB2B OEM Partner API
  tags:
    - OEM
    - Domain Management
    - Partner
    - Usage
    - Billing
  humanURL: https://support.rb2b.com/en/articles/12880800-using-the-rb2b-oem-program-api-webhook-guide
  baseURL: https://app.rb2b.com/api/v1
  description: >-
    The domain-management and usage API for RB2B OEM partners embedding RB2B
    identification inside their own platforms — POST /add_domain, POST
    /delete_domain, GET /domains and GET /credit_usage, authenticated with an
    Api-Key header issued on the OEM dashboard. The API is the ONLY supported
    way to authorize a domain: RB2B ignores traffic from any domain not added
    here, even when the OEM tracking script is installed. Credit usage returns
    credits_used with the last and next billing dates.
  properties:
    - url: https://support.rb2b.com/en/articles/12880800-using-the-rb2b-oem-program-api-webhook-guide
      type: Documentation
    - url: https://support.rb2b.com/en/articles/12579426-rb2b-s-oem-partner-program
      type: SignUp
    - url: https://app.rb2b.com/oem_dashboard
      type: Portal
  x-evidence:
    verified: '2026-08-12'
    method: live probe
    checks:
