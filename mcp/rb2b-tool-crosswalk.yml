    api.rb2b.com/openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
    /api-docs, /docs, /redoc and at the site and console hosts.
  rest:
    base_url: https://api.rb2b.com/api/v1
    auth: Api-Key request header
    gated: true
    gated_note: >-
      Endpoints are live and anonymously reachable but return HTTP 401
      {"error":"missing_api_key"}; request/response schemas below come from the
      published client and the OEM guide, not from an authenticated call.
  graphql: null
  mcp:
    package: "@rb2b/rb2b-apis-mcp"
    transport: stdio
    hosted: false
    gated: false
    note: The tool list is readable from the published npm tarball without credentials.
  oem_rest:
    base_url: https://app.rb2b.com/api/v1
    auth: Api-Key request header
    note: >-
      The OEM domain-management + credit-usage endpoints are a separate REST
      surface with no MCP tools at all (see rest_only[]).
