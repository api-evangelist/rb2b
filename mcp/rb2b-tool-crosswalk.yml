source: >-
  Derived by reading the RB2B client inside the provider's own published MCP
  package (@rb2b/rb2b-apis-mcp 1.1.7, dist/api.js), which maps every MCP tool
  onto the REST path it calls on https://api.rb2b.com/api/v1. RB2B publishes no
  OpenAPI, so the `rest:` column carries the real HTTP method + path pair rather
  than an operationId — there is no spec to name one. Confidence is high for
  every row because the binding is read from the provider's shipped source, not
  inferred from naming.
description: >-
  Binding between the 19 RB2B MCP tools and the RB2B Identity / Enrichment REST
  surface. Notable divergences: three account tools are local-only or map to a
  different verb than their name suggests, and four "email_*" tools reuse the
  same "hem_*" REST endpoints with an `email` body key instead of `md5` — so the
  REST surface is 13 endpoints behind 19 tools.
surfaces:
