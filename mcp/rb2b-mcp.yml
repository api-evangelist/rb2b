method: searched
status: published
source: https://www.npmjs.com/package/@rb2b/rb2b-apis-mcp
description: >-
  RB2B publishes a first-party local (stdio) MCP server, @rb2b/rb2b-apis-mcp,
  that exposes the RB2B Identity / Enrichment API Partner Program surface
  (https://api.rb2b.com/api/v1) as 19 MCP tools for Claude Desktop, Claude Code
  and other MCP clients. There is no hosted/remote MCP endpoint — mcp.rb2b.com
  does not resolve. The tool list below is EXTRACTED VERBATIM from the published
  package's own ListToolsRequestSchema handler (dist/server.js) in version
  1.1.7; the machine-readable form, with each tool's real inputSchema, is saved
  alongside as mcp/rb2b-mcp-tools.json. The package README is saved as
  mcp/rb2b-mcp-readme.md.
ownership:
  first_party: true
  evidence: >-
    Published under the @rb2b npm scope with package author "RB2B", MIT
    licensed, and points users at RB2B's own API console at
    https://ui.api.rb2b.com for accounts and keys. The git repository named in
    package.json (github.com/robbclarke/RB2B-APIs-MCP) is not publicly readable
    (HTTP 404 on the GitHub API); the same GitHub account publishes
    robbclarke/RB2B-WordPress-Plugin, described as "RB2B's WordPress plugin".
    Treated as first-party on the npm scope + author + console evidence, with
    the repository caveat recorded here rather than hidden.
server:
  name: rb2b
  transport: stdio
  hosted: false
  remote_url: null
  package: "@rb2b/rb2b-apis-mcp"
  version: 1.1.7
  published: '2026-04-13'
  install: npx -y @rb2b/rb2b-apis-mcp
  setup: npx -y @rb2b/rb2b-apis-mcp init
  register_claude_code: claude mcp add rb2b -- npx -y @rb2b/rb2b-apis-mcp
  auth: api-key
  auth_detail: >-
    The server holds an RB2B API key, stored at ~/.rb2b/config.json with mode
    0600, and sends it upstream as the Api-Key request header. There is no OAuth
    flow; /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both 404 on api.rb2b.com.
  backing_api: https://api.rb2b.com/api/v1
  runtime: Node.js 18+
  sdk: "@modelcontextprotocol/sdk ^1.0.0"
runtime_semantics:
  rate_limit: 50 requests/second per endpoint (surfaced by the server as an error on HTTP 429)
  metering: >-
    Every paid tool deducts credits from the account balance. The server checks
    the balance before each paid call and refuses when credits are insufficient.
  credit_warnings: >-
    Warnings are appended to responses at balances of 500, 200, 100, 50 and 10
    credits — [NOTICE] 500-51, [WARNING] 50-11, [CRITICAL] 10 and below.
  error_mapping:
    401: Invalid API key — re-run `npx @rb2b/rb2b-apis-mcp init`
    404: No record found for the provided input
    429: Rate limit exceeded (50 requests/second per endpoint)
